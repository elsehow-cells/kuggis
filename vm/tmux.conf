# box: tmux defaults for Claude Code sessions; box sync rewrites this file while this line is first
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 50000
set -g extended-keys on
set -g focus-events on
# Don't forward a pane's OSC 52 clipboard writes to the laptop terminal:
# a VM session should not be able to set the owner's clipboard.
set -g set-clipboard off

# Status bar (status.sh): project · session in the project's colour, other
# sessions here waiting on you, and this worktree's unpushed work. No window
# list (there is one window) and no clock (the laptop has one). The hook
# redraws it as soon as a session's state changes.
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 100
set -g status-right-length 60
set -g status-left '#(~/.box/status.sh left #S) '
set -g status-right '#(~/.box/status.sh right #S)'
set -g window-status-format ''
set -g window-status-current-format ''
# The laptop terminal's tab reads project/session. bootstrap.sh appends @box_project.
set -g set-titles on
set -g set-titles-string '#{@box_project}/#S'
