<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuggis</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/cells.css">
<script src="/common.js"></script>
<script src="/cells.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="brand">kuggis</a>
  <nav aria-label="Views"><a href="/" aria-current="page">Cells</a><a href="/reviews">PRs</a></nav>
  <label class="theme-pick"><span class="sr-only">Theme</span><select id="theme" aria-label="Theme"></select></label>
</header>
<main>
  <div class="overview"><h1>Cells</h1><div class="summary"><span id="summary"></span><button id="refresh" type="button" title="Refresh (r)">Refresh</button></div></div>
  <p id="error" role="alert" hidden></p>
  <div id="cells" aria-label="Cells"><p class="empty">Loading…</p></div>
  <footer><span id="status" role="status"></span><span><kbd>↵</kbd> copy command <span class="sep">·</span> <kbd>r</kbd> refresh</span></footer>
</main>
<dialog id="definition" aria-labelledby="definition-title">
  <header><h2 id="definition-title"></h2><button id="close-definition" type="button" aria-label="Close definition">Close</button></header>
  <p id="definition-meta"></p>
  <pre id="definition-text"></pre>
</dialog>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
